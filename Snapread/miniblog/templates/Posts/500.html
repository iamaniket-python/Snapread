<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>500 — SnapRead</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #f9f6f1;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(220,38,38,.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(220,38,38,.03) 0%, transparent 50%);
      pointer-events: none;
    }

    .wrap {
      text-align: center;
      padding: 48px 24px;
      max-width: 520px;
      width: 100%;
      animation: fadeUp .6s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .code {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(96px, 20vw, 160px);
      line-height: 1;
      color: #111;
      letter-spacing: -4px;
      position: relative;
      display: inline-block;
      margin-bottom: 8px;
    }

    .code::after {
      content: attr(data-code);
      position: absolute; inset: 0;
      color: #dc2626;
      clip-path: inset(0 0 60% 0);
      opacity: .15;
      transform: translateY(6px);
    }

    .divider {
      width: 48px; height: 2px;
      background: #dc2626;
      margin: 0 auto 24px;
      border-radius: 99px;
      opacity: .4;
    }

    .title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(22px, 5vw, 30px);
      color: #111;
      margin-bottom: 12px;
      letter-spacing: -.3px;
    }

    .desc {
      font-size: 15px;
      color: #6b7280;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .actions {
      display: flex; gap: 12px;
      justify-content: center; flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 14px; font-weight: 600;
      font-family: inherit;
      cursor: pointer; text-decoration: none;
      transition: all .15s;
      display: inline-flex; align-items: center; gap: 8px;
      border: none;
    }

    .btn-primary {
      background: #111; color: #fff;
    }
    .btn-primary:hover { background: #333; }

    .btn-ghost {
      background: #fff; color: #374151;
      border: 1.5px solid #e5e7eb;
    }
    .btn-ghost:hover { border-color: #111; color: #111; }

    /* Glitch animation on illustration */
    .illustration {
      margin-bottom: 32px;
      animation: glitch 4s infinite;
    }

    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92%  { transform: translate(-2px, 1px); }
      94%  { transform: translate(2px, -1px); }
      96%  { transform: translate(-1px, 2px); }
      98%  { transform: translate(1px, -2px); }
    }
  </style>
</head>
<body>

<div class="wrap">

  <div class="illustration">
    <svg width="120" height="80" viewBox="0 0 120 80" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Server/machine body -->
      <rect x="30" y="10" width="60" height="55" rx="5" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
      <!-- Screen -->
      <rect x="38" y="18" width="44" height="28" rx="3" fill="#fff" stroke="#fca5a5" stroke-width="1"/>
      <!-- Error lines on screen -->
      <rect x="42" y="23" width="20" height="2.5" rx="1" fill="#dc2626" opacity=".5"/>
      <rect x="42" y="29" width="32" height="2.5" rx="1" fill="#dc2626" opacity=".3"/>
      <rect x="42" y="35" width="26" height="2.5" rx="1" fill="#dc2626" opacity=".3"/>
      <!-- X mark -->
      <line x1="66" y1="22" x2="72" y2="28" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <line x1="72" y1="22" x2="66" y2="28" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
      <!-- Power button -->
      <circle cx="60" cy="56" r="5" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
      <line x1="60" y1="53" x2="60" y2="56" stroke="#dc2626" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Smoke/steam -->
      <path d="M45 10 Q43 5 45 1" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".5"/>
      <path d="M60 10 Q58 4 60 0" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".4"/>
      <path d="M75 10 Q73 5 75 1" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".5"/>
    </svg>
  </div>

  <div class="code" data-code="500">500</div>
  <div class="divider"></div>

  <h1 class="title">Server mein kuch gadbad hui</h1>
  <p class="desc">
    Hamare server ne kuch unexpected kar diya.<br/>
    Hum isko theek karne ki koshish kar rahe hain — thodi der mein dobara try karein.
  </p>

  <div class="actions">
    <a href="/" class="btn btn-primary">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/>
      </svg>
      Home pe jaayein
    </a>
    <a href="javascript:location.reload()" class="btn btn-ghost">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
      Dobara try karein
    </a>
  </div>

</div>

</body>
</html>
