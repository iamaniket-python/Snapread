{% extends 'Base/base.html' %}
{% block title %}Edit Profile — Medium{% endblock %}

{% block content %}
<div style="max-width:600px;margin:0 auto;padding:48px 24px;">

  <h1 style="font-size:26px;font-weight:700;margin-bottom:32px;">Edit profile</h1>

  <form method="POST" action="{% url 'profile_edit' %}" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Avatar -->
    <div style="display:flex;align-items:center;gap:20px;margin-bottom:28px;">
      <img id="avatarPreview"
           src="{% if profile.profile_image %}{{ profile.profile_image.url }}{% else %}/static/img/avatar.png{% endif %}"
           alt="{{ profile.user.username }}"
           style="width:80px;height:80px;border-radius:50%;object-fit:cover;border:2px solid var(--gray-200);" />
      <div>
        <label class="btn btn-outline btn-sm" style="cursor:pointer;">
          Change photo
          <input type="file" name="profile_image" accept="image/*" style="display:none;"
                 onchange="previewAvatar(this)" />
        </label>
        <p class="form-hint" style="margin-top:6px;">JPG, PNG — max 5MB</p>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Name (username)</label>
      <input type="text" class="form-control" value="{{ profile.user.username }}" disabled
             style="background:var(--gray-50);color:var(--gray-600);" />
      <p class="form-hint">Username cannot be changed.</p>
    </div>

    <div class="form-group">
      <label class="form-label">Bio</label>
      <textarea name="bio" class="form-control" rows="4"
                placeholder="Write a short bio about yourself…">{{ profile.bio|default:'' }}</textarea>
    </div>

    <div class="form-group">
      <label class="form-label">Website</label>
      <input type="url" name="website" class="form-control"
             placeholder="https://yoursite.com"
             value="{{ profile.website|default:'' }}" />
    </div>

    <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px;">
      <a href="{% url 'profile' request.user.username %}" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-dark">Save changes</button>
    </div>
  </form>

</div>
{% endblock %}

{% block extra_js %}
<script>
function previewAvatar(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => document.getElementById('avatarPreview').src = e.target.result;
    reader.readAsDataURL(input.files[0]);
  }
}
</script>
{% endblock %}
